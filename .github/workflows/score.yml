name: Score

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Corpus self-check
        run: python tools/selfcheck.py

      - name: Score reference baseline
        run: |
          python tools/score.py --scanner "python tools/baseline.py {sample}" --json > score-baseline.json
          python tools/ci_summary.py score-baseline.json

      - name: Write step summary
        if: always()
        run: python tools/ci_summary.py score-baseline.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload score artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-baseline
          path: score-baseline.json
          if-no-files-found: ignore
